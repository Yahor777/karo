name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: TypeScript and Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest
        run: pnpm test

      - name: Typecheck desktop app
        run: pnpm --filter @ai-agent-orchestrator/desktop-windows exec tsc --noEmit

      - name: Cargo check
        working-directory: apps/desktop-windows/src-tauri
        run: cargo check

      - name: Cargo test
        working-directory: apps/desktop-windows/src-tauri
        run: cargo test
